<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d11" />
    <meta name="application-name" content="BPDS" />
    <link rel="manifest" href="https://bpds-app.vercel.app/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="https://bpds-app.vercel.app/bpds-icon.svg" />
    <link rel="stylesheet" crossorigin href="https://bpds-app.vercel.app/assets/index-D7cjH5pi.css" />
    <title>BPDS — Basketball Player Development System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="https://bpds-app.vercel.app/assets/index-DxXcCKDq.js"></script>
    <script>
      (() => {
        const ICON = 'https://bpds-app.vercel.app/bpds-icon.svg';
        const patch = () => {
          document.querySelectorAll('button,a').forEach((el) => {
            if ((el.textContent || '').trim().toLowerCase() === 'view demo') el.remove();
          });

          document.querySelectorAll('header *').forEach((el) => {
            if (el.children.length === 0 && (el.textContent || '').trim() === '🏀') {
              el.textContent = '';
              const img = document.createElement('img');
              img.src = ICON;
              img.alt = 'BPDS';
              img.width = 38;
              img.height = 38;
              img.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;border-radius:10px';
              el.appendChild(img);
            }
          });
        };
        new MutationObserver(patch).observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', patch);
        setTimeout(patch, 0);
      })();
    </script>
  </body>
</html>
