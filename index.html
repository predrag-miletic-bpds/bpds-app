<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d11" />
  <meta name="application-name" content="BPDS" />
  <link rel="manifest" href="https://bpds-app.vercel.app/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="https://bpds-app.vercel.app/bpds-icon.svg" />
  <link rel="stylesheet" crossorigin href="https://bpds-app.vercel.app/assets/index-D7cjH5pi.css" />
  <title>BPDS — Basketball Player Development System</title>
  <style>
    .bpds-thumb-media{width:100%;height:100%;display:block;object-fit:cover;border:0;border-radius:inherit;background:#0a0d10}
    .bpds-thumb-youtube{position:relative;width:100%;height:100%;background-size:cover;background-position:center;border-radius:inherit;overflow:hidden}
    .bpds-thumb-youtube:after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding-left:2px}
    .bpds-video-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#737b86;font-size:34px;background:#0a0d10;border-radius:inherit}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (()=>{
    const SUPABASE_URL='https://xnbpadoizmmggsvfcygc.supabase.co';
    const SUPABASE_KEY='sb_publishable_c8x9vhv56LERv3m7EYme1w_Wx-JLclm';
    const PROJECT_REF='xnbpadoizmmggsvfcygc';
    const byCode=new Map(), signed=new Map();
    let loadedToken='';

    function token(){
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i)||'';
        if(k===`sb-${PROJECT_REF}-auth-token`||(k.includes(PROJECT_REF)&&k.includes('auth-token'))){
          try{
            const v=JSON.parse(localStorage.getItem(k)||'{}');
            const t=v?.access_token||v?.currentSession?.access_token||v?.session?.access_token;
            if(t)return t;
          }catch{}
        }
      }
      return '';
    }

    async function loadDrills(){
      const t=token();
      if(!t||t===loadedToken)return;
      loadedToken=t;
      try{
        const r=await fetch(`${SUPABASE_URL}/rest/v1/drills?select=id,code,name,data&order=updated_at.desc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${t}`}});
        if(!r.ok){loadedToken='';return;}
        const rows=await r.json();
        byCode.clear();
        for(const row of rows){
          const code=String(row?.data?.code||row?.code||'').trim().toUpperCase();
          const video=String(row?.data?.videoUrl||'').trim();
          if(code&&video)byCode.set(code,video);
        }
        patch();
      }catch{loadedToken='';}
    }

    async function resolve(raw){
      if(!raw||!raw.startsWith('supabase://'))return raw||'';
      if(signed.has(raw))return signed.get(raw);
      const m=raw.match(/^supabase:\/\/([^/]+)\/(.+)$/i);
      const t=token();
      if(!m||!t)return '';
      const path=m[2].split('/').map(encodeURIComponent).join('/');
      try{
        const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${encodeURIComponent(m[1])}/${path}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:`Bearer ${t}`},body:JSON.stringify({expiresIn:3600})});
        if(!r.ok)return '';
        const j=await r.json();
        let u=j?.signedURL||j?.signedUrl||'';
        if(u.startsWith('/'))u=`${SUPABASE_URL}/storage/v1${u}`;
        if(u)signed.set(raw,u);
        return u;
      }catch{return '';}
    }

    function youtubeId(raw){
      try{
        const u=new URL(raw),h=u.hostname.replace(/^www\./,'').toLowerCase();
        if(h==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';
        if(h==='youtube.com'||h==='m.youtube.com'){
          if(u.pathname==='/watch')return u.searchParams.get('v')||'';
          const p=u.pathname.split('/').filter(Boolean);
          if(['shorts','embed','live'].includes(p[0]))return p[1]||'';
        }
      }catch{}
      return '';
    }

    async function mountThumb(box,code,raw){
      if(!box||box.dataset.bpdsVideoCode===code)return;
      const url=await resolve(raw); if(!url||!box.isConnected)return;
      const yt=youtubeId(url);
      box.dataset.bpdsVideoCode=code;
      if(yt){
        const d=document.createElement('div');
        d.className='bpds-thumb-youtube';
        d.style.backgroundImage=`url(https://i.ytimg.com/vi/${encodeURIComponent(yt)}/hqdefault.jpg)`;
        box.replaceChildren(d);
      }else{
        const v=document.createElement('video');
        v.className='bpds-thumb-media'; v.src=url; v.muted=true; v.playsInline=true; v.preload='metadata';
        v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(.5,Math.max(.08,(v.duration||1)*.03))}catch{}},{once:true});
        v.addEventListener('seeked',()=>{try{v.pause()}catch{}},{once:true});
        box.replaceChildren(v);
      }
    }

    async function mountPractice(box,code,raw){
      if(!box)return;
      if(!raw){
        if(box.dataset.bpdsVideoPatched!=='empty'){
          const p=document.createElement('div'); p.className='bpds-video-placeholder'; p.textContent='▶';
          box.replaceChildren(p); box.dataset.bpdsVideoPatched='empty';
        }
        return;
      }
      if(box.dataset.bpdsVideoPatched===code)return;
      const url=await resolve(raw); if(!url||!box.isConnected)return;
      const yt=youtubeId(url),m=document.createElement(yt?'iframe':'video');
      m.style.cssText='width:100%;height:100%;display:block;border:0;border-radius:14px;background:#0a0d10;object-fit:contain';
      if(yt){m.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?rel=0&playsinline=1`;m.title=code;m.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';m.allowFullscreen=true;}
      else{m.src=url;m.controls=true;m.playsInline=true;m.preload='metadata';}
      box.replaceChildren(m); box.dataset.bpdsVideoPatched=code;
    }

    function patchTrainingRows(){
      document.querySelectorAll('[class*="_itemCode_19bwe_"]').forEach(codeEl=>{
        const code=(codeEl.textContent||'').trim().toUpperCase();
        const raw=byCode.get(code); if(!raw)return;
        const row=codeEl.closest('[class*="_item_19bwe_"]');
        const thumb=row?.querySelector('[class*="_thumb_19bwe_"]');
        if(thumb)mountThumb(thumb,code,raw);
      });
    }

    function patchPracticeMode(){
      const codeEl=document.querySelector('[class*="_code_zwdo2_"]');
      const box=document.querySelector('[class*="_video_zwdo2_"]');
      if(!codeEl||!box)return;
      const code=(codeEl.textContent||'').trim().toUpperCase();
      mountPractice(box,code,byCode.get(code)||'');
    }

    function patch(){loadDrills();patchTrainingRows();patchPracticeMode();}
    new MutationObserver(()=>{clearTimeout(window.__bpdsExactVideoPatch);window.__bpdsExactVideoPatch=setTimeout(patch,80)}).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
    addEventListener('DOMContentLoaded',patch);
    addEventListener('storage',()=>{loadedToken='';byCode.clear();signed.clear();patch();});
    setInterval(patch,1000);
  })();
  </script>
  <script type="module" crossorigin src="https://bpds-app.vercel.app/assets/index-DxXcCKDq.js"></script>
</body>
</html>
