<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d11" />
  <meta name="application-name" content="BPDS" />
  <link rel="manifest" href="https://bpds-app.vercel.app/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="https://bpds-app.vercel.app/bpds-icon.svg" />
  <link rel="stylesheet" crossorigin href="https://bpds-app.vercel.app/assets/index-D7cjH5pi.css" />
  <title>BPDS — Basketball Player Development System</title>
  <style>
    .bpds-thumb-media{width:100%;height:100%;display:block;object-fit:cover;border:0;border-radius:inherit;background:#0a0d10;pointer-events:none}
    .bpds-thumb-youtube{position:relative;width:100%;height:100%;background-size:cover;background-position:center;border-radius:inherit;overflow:hidden;pointer-events:none}
    .bpds-video-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#737b86;font-size:34px;background:#0a0d10;border-radius:inherit}
    .bpds-library-db-media{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;border:0;background:#0a0d10;pointer-events:none;z-index:0}
    .bpds-library-db-youtube{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none;z-index:0}
    .bpds-detail-empty{width:100%;aspect-ratio:16/9;display:grid;place-items:center;color:#737b86;font-size:40px;background:#0a0d10;border-radius:inherit}
    .bpds-detail-db-media{width:100%;aspect-ratio:16/9;display:block;object-fit:contain;border:0;background:#0a0d10;border-radius:inherit}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (()=>{
    const SUPABASE_URL='https://xnbpadoizmmggsvfcygc.supabase.co';
    const SUPABASE_KEY='sb_publishable_c8x9vhv56LERv3m7EYme1w_Wx-JLclm';
    const PROJECT_REF='xnbpadoizmmggsvfcygc';
    const CODE_RE=/^(?:WUP|BM|SBH|MBH|COD|SH|PASS|FIN|DEF|SSG|ATH|PLY)-[A-Z0-9-]+$/i;
    const byCode=new Map(), signed=new Map();
    let loadedToken='';

    function token(){
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i)||'';
        if(k===`sb-${PROJECT_REF}-auth-token`||(k.includes(PROJECT_REF)&&k.includes('auth-token'))){
          try{
            const v=JSON.parse(localStorage.getItem(k)||'{}');
            const t=v?.access_token||v?.currentSession?.access_token||v?.session?.access_token;
            if(t)return t;
          }catch{}
        }
      }
      return '';
    }

    async function loadDrills(){
      const t=token();
      if(!t||t===loadedToken)return;
      loadedToken=t;
      try{
        const r=await fetch(`${SUPABASE_URL}/rest/v1/drills?select=id,code,name,data&order=updated_at.desc`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${t}`}});
        if(!r.ok){loadedToken='';return;}
        const rows=await r.json();
        byCode.clear();
        for(const row of rows){
          const code=String(row?.data?.code||row?.code||'').trim().toUpperCase();
          const video=String(row?.data?.videoUrl||'').trim();
          if(code&&video)byCode.set(code,video);
        }
        patch();
      }catch{loadedToken='';}
    }

    async function resolve(raw){
      if(!raw||!raw.startsWith('supabase://'))return raw||'';
      if(signed.has(raw))return signed.get(raw);
      const m=raw.match(/^supabase:\/\/([^/]+)\/(.+)$/i);
      const t=token();
      if(!m||!t)return '';
      const path=m[2].split('/').map(encodeURIComponent).join('/');
      try{
        const r=await fetch(`${SUPABASE_URL}/storage/v1/object/sign/${encodeURIComponent(m[1])}/${path}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:`Bearer ${t}`},body:JSON.stringify({expiresIn:3600})});
        if(!r.ok)return '';
        const j=await r.json();
        let u=j?.signedURL||j?.signedUrl||'';
        if(u.startsWith('/'))u=`${SUPABASE_URL}/storage/v1${u}`;
        if(u)signed.set(raw,u);
        return u;
      }catch{return '';}
    }

    function youtubeId(raw){
      try{
        const u=new URL(raw),h=u.hostname.replace(/^www\./,'').toLowerCase();
        if(h==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';
        if(h==='youtube.com'||h==='m.youtube.com'){
          if(u.pathname==='/watch')return u.searchParams.get('v')||'';
          const p=u.pathname.split('/').filter(Boolean);
          if(['shorts','embed','live'].includes(p[0]))return p[1]||'';
        }
      }catch{}
      return '';
    }

    async function mountThumb(box,code,raw){
      if(!box||box.dataset.bpdsVideoCode===code)return;
      const url=await resolve(raw); if(!url||!box.isConnected)return;
      const yt=youtubeId(url);
      box.dataset.bpdsVideoCode=code;
      if(yt){
        const d=document.createElement('div');
        d.className='bpds-thumb-youtube';
        d.style.backgroundImage=`url(https://i.ytimg.com/vi/${encodeURIComponent(yt)}/hqdefault.jpg)`;
        box.replaceChildren(d);
      }else{
        const v=document.createElement('video');
        v.className='bpds-thumb-media'; v.src=url; v.muted=true; v.playsInline=true; v.preload='metadata';
        v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(.5,Math.max(.08,(v.duration||1)*.03))}catch{}},{once:true});
        v.addEventListener('seeked',()=>{try{v.pause()}catch{}},{once:true});
        box.replaceChildren(v);
      }
    }

    async function mountLibraryThumb(box,code,raw){
      if(!box||box.dataset.bpdsLibraryVideoCode===code||box.dataset.bpdsLibraryVideoPending===code)return;
      box.dataset.bpdsLibraryVideoPending=code;
      const url=await resolve(raw);
      if(!url||!box.isConnected){delete box.dataset.bpdsLibraryVideoPending;return;}
      const current=(box.querySelector('[class*="_thumbCode_1lvct_"]')?.textContent||'').trim().toUpperCase();
      if(current!==code){delete box.dataset.bpdsLibraryVideoPending;return;}
      box.querySelectorAll('.bpds-library-db-media,.bpds-library-db-youtube').forEach(el=>el.remove());
      const yt=youtubeId(url);
      let media;
      if(yt){
        media=document.createElement('div');
        media.className='bpds-library-db-youtube';
        media.style.backgroundImage=`url(https://i.ytimg.com/vi/${encodeURIComponent(yt)}/hqdefault.jpg)`;
      }else{
        media=document.createElement('video');
        media.className='bpds-library-db-media'; media.src=url; media.muted=true; media.playsInline=true; media.preload='metadata';
        media.addEventListener('loadedmetadata',()=>{try{media.currentTime=Math.min(.5,Math.max(.08,(media.duration||1)*.03))}catch{}},{once:true});
        media.addEventListener('seeked',()=>{try{media.pause()}catch{}},{once:true});
      }
      box.prepend(media);
      box.dataset.bpdsLibraryVideoCode=code;
      delete box.dataset.bpdsLibraryVideoPending;
    }

    async function mountPractice(box,code,raw){
      if(!box)return;
      if(!raw){
        if(box.dataset.bpdsVideoPatched!=='empty'){
          const p=document.createElement('div'); p.className='bpds-video-placeholder'; p.textContent='▶';
          box.replaceChildren(p); box.dataset.bpdsVideoPatched='empty';
        }
        return;
      }
      if(box.dataset.bpdsVideoPatched===code)return;
      const url=await resolve(raw); if(!url||!box.isConnected)return;
      const yt=youtubeId(url),m=document.createElement(yt?'iframe':'video');
      m.style.cssText='width:100%;height:100%;display:block;border:0;border-radius:14px;background:#0a0d10;object-fit:contain';
      if(yt){m.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?rel=0&playsinline=1`;m.title=code;m.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';m.allowFullscreen=true;}
      else{m.src=url;m.controls=true;m.playsInline=true;m.preload='metadata';}
      box.replaceChildren(m); box.dataset.bpdsVideoPatched=code;
    }

    function patchTrainingRows(){
      document.querySelectorAll('[class*="_itemCode_19bwe_"]').forEach(codeEl=>{
        const code=(codeEl.textContent||'').trim().toUpperCase();
        const raw=byCode.get(code); if(!raw)return;
        const row=codeEl.closest('[class*="_item_19bwe_"]');
        const thumb=row?.querySelector('[class*="_thumb_19bwe_"]');
        if(thumb)mountThumb(thumb,code,raw);
      });
    }

    function onDrillLibrary(){
      return [...document.querySelectorAll('h1,h2,h3')].some(el=>/drill\s+library/i.test((el.textContent||'').trim()));
    }

    function patchDrillLibrary(){
      if(!onDrillLibrary())return;
      document.querySelectorAll('[class*="_thumb_1lvct_"]').forEach(thumb=>{
        const codeEl=thumb.querySelector('[class*="_thumbCode_1lvct_"]');
        const code=(codeEl?.textContent||'').trim().toUpperCase();
        if(!CODE_RE.test(code))return;
        const raw=byCode.get(code); if(raw)mountLibraryThumb(thumb,code,raw);
      });
    }

    function drillDetailCode(){
      const m=location.pathname.match(/^\/drill\/([^/?#]+)/i);
      if(!m)return '';
      try{return decodeURIComponent(m[1]).trim().toUpperCase()}catch{return String(m[1]||'').trim().toUpperCase()}
    }

    function detailBaseMedia(){
      const marked=document.querySelector('[data-bpds-detail-base="1"]');
      if(marked?.isConnected)return marked;
      const all=[...document.querySelectorAll('main video,main iframe,video,iframe')].filter(el=>!el.classList.contains('bpds-detail-db-media')&&el.isConnected);
      const visible=all.filter(el=>{
        const r=el.getBoundingClientRect();
        return r.width>=240&&r.height>=120;
      });
      const media=visible.sort((a,b)=>{
        const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();
        return (y.width*y.height)-(x.width*x.height);
      })[0]||null;
      if(media)media.dataset.bpdsDetailBase='1';
      return media;
    }

    async function patchDrillDetail(){
      const code=drillDetailCode();
      if(!code||!byCode.size)return;
      const media=detailBaseMedia(); if(!media)return;
      const host=media.parentElement; if(!host)return;
      const raw=byCode.get(code)||'';
      const empty=host.querySelector('.bpds-detail-empty');
      const injected=host.querySelector('.bpds-detail-db-media');

      if(!raw){
        injected?.remove();
        media.style.display='none';
        if(empty?.dataset.bpdsDetailCode===code)return;
        empty?.remove();
        const p=document.createElement('div'); p.className='bpds-detail-empty'; p.textContent='▶'; p.dataset.bpdsDetailCode=code;
        host.insertBefore(p,media);
        media.dataset.bpdsDetailCode=code;
        return;
      }

      empty?.remove();
      const url=await resolve(raw); if(!url||!media.isConnected)return;
      const yt=youtubeId(url);
      if(yt){
        media.style.display='none';
        if(injected?.dataset.bpdsDetailCode===code&&injected.dataset.bpdsDetailUrl===url)return;
        injected?.remove();
        const f=document.createElement('iframe');
        f.className='bpds-detail-db-media';
        f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt)}?rel=0&playsinline=1`;
        f.title=code; f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'; f.allowFullscreen=true;
        f.dataset.bpdsDetailCode=code; f.dataset.bpdsDetailUrl=url;
        host.insertBefore(f,media);
        return;
      }

      if(media.tagName==='VIDEO'){
        injected?.remove();
        media.style.removeProperty('display');
        if(media.dataset.bpdsDetailCode===code&&media.dataset.bpdsDetailUrl===url)return;
        media.src=url; media.controls=true; media.playsInline=true; media.preload='metadata';
        media.dataset.bpdsDetailCode=code; media.dataset.bpdsDetailUrl=url;
      }else{
        media.style.display='none';
        if(injected?.dataset.bpdsDetailCode===code&&injected.dataset.bpdsDetailUrl===url)return;
        injected?.remove();
        const v=document.createElement('video');
        v.className='bpds-detail-db-media'; v.src=url; v.controls=true; v.playsInline=true; v.preload='metadata';
        v.dataset.bpdsDetailCode=code; v.dataset.bpdsDetailUrl=url;
        host.insertBefore(v,media);
      }
    }

    function removeDeadUi(){
      document.querySelectorAll('button,a').forEach(el=>{
        const text=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
        if(text==='view demo'||text==='demo')el.remove();
      });
      if(onDrillLibrary()){
        document.querySelectorAll('button').forEach(el=>{
          const text=(el.textContent||'').trim();
          if(/^(▶|►|▷|play)$/i.test(text)){
            const r=el.getBoundingClientRect();
            if(r.width<90&&r.height<90)el.remove();
          }
        });
      }
    }

    function patchPracticeMode(){
      const codeEl=document.querySelector('[class*="_code_zwdo2_"]');
      const box=document.querySelector('[class*="_video_zwdo2_"]');
      if(!codeEl||!box)return;
      const code=(codeEl.textContent||'').trim().toUpperCase();
      mountPractice(box,code,byCode.get(code)||'');
    }

    function patch(){loadDrills();removeDeadUi();patchDrillLibrary();patchTrainingRows();patchDrillDetail();patchPracticeMode();}
    new MutationObserver(()=>{clearTimeout(window.__bpdsExactVideoPatch);window.__bpdsExactVideoPatch=setTimeout(patch,80)}).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
    addEventListener('DOMContentLoaded',patch);
    addEventListener('storage',()=>{loadedToken='';byCode.clear();signed.clear();patch();});
    setInterval(patch,1000);
  })();
  </script>
  <script type="module" crossorigin src="https://bpds-app.vercel.app/assets/index-DxXcCKDq.js"></script>
</body>
</html>
