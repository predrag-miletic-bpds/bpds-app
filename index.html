<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d11" />
  <meta name="application-name" content="BPDS" />
  <link rel="manifest" href="https://bpds-app.vercel.app/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="https://bpds-app.vercel.app/bpds-icon.svg" />
  <link rel="stylesheet" crossorigin href="https://bpds-app.vercel.app/assets/index-D7cjH5pi.css" />
  <title>BPDS — Basketball Player Development System</title>
</head>
<body>
  <div id="root"></div>
  <script>
  (() => {
    const ICON = 'https://bpds-app.vercel.app/bpds-icon.svg';
    const CACHE_KEY = '__bpds_remote_drill_data_v2';
    const VIDEO_KEY = /video|media|demo/i;
    const VIDEO_URL = /https?:\/\/[^\s"'<>]+/ig;
    const isVideoUrl = (u) => typeof u === 'string' && (/youtu\.be|youtube\.com/i.test(u) || /\.(mp4|webm|mov|m4v|ogg)(\?|#|$)/i.test(u));

    const remoteData = [];
    try {
      const saved = JSON.parse(sessionStorage.getItem(CACHE_KEY) || '[]');
      if (Array.isArray(saved)) remoteData.push(...saved);
    } catch {}

    const remember = (data) => {
      if (!data || typeof data !== 'object') return;
      try {
        const text = JSON.stringify(data);
        if (!/video|media|youtu|\.mp4|\.webm/i.test(text)) return;
        remoteData.push(data);
        if (remoteData.length > 30) remoteData.splice(0, remoteData.length - 30);
        sessionStorage.setItem(CACHE_KEY, JSON.stringify(remoteData));
        setTimeout(patch, 0);
      } catch {}
    };

    // Capture Supabase/API drill responses before the bundled app consumes them.
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (...args) => {
      const response = await nativeFetch(...args);
      try {
        const clone = response.clone();
        const type = clone.headers.get('content-type') || '';
        if (type.includes('json')) clone.json().then(remember).catch(() => {});
      } catch {}
      return response;
    };

    const ytEmbed = (raw) => {
      try {
        const u = new URL(raw);
        const host = u.hostname.replace(/^www\./, '').toLowerCase();
        let id = '';
        if (host === 'youtu.be') id = u.pathname.split('/').filter(Boolean)[0] || '';
        else if (host === 'youtube.com' || host === 'm.youtube.com') {
          if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
          else {
            const p = u.pathname.split('/').filter(Boolean);
            if (['shorts','embed','live'].includes(p[0])) id = p[1] || '';
          }
        }
        return id ? `https://www.youtube.com/embed/${id}?rel=0&playsinline=1` : null;
      } catch { return null; }
    };

    const currentDrill = () => {
      const text = document.body?.innerText || '';
      const code = (text.match(/\b(?:WUP|BM|SBH|MBH|COD|SH|PASS|FIN|DEF|SSG|ATH|PLY)-[A-Z0-9-]+\b/i) || [])[0] || '';
      const headings = [...document.querySelectorAll('h1,h2,h3')].map(e => (e.textContent || '').trim()).filter(Boolean);
      return { code: code.toUpperCase(), name: headings.find(t => !/practice|training|bpds/i.test(t)) || '' };
    };

    const findUrlInObject = (node, drill, seen = new WeakSet()) => {
      if (!node || typeof node !== 'object' || seen.has(node)) return null;
      seen.add(node);
      let ownText = '';
      try { ownText = JSON.stringify(node); } catch { return null; }
      const low = ownText.toLowerCase();
      const matches = (drill.code && low.includes(drill.code.toLowerCase())) || (drill.name && low.includes(drill.name.toLowerCase()));
      if (matches) {
        for (const [k, v] of Object.entries(node)) {
          if (typeof v === 'string' && VIDEO_KEY.test(k) && isVideoUrl(v)) return v;
        }
        const urls = ownText.match(VIDEO_URL) || [];
        const hit = urls.find(isVideoUrl);
        if (hit) return hit.replace(/\\u0026/g, '&').replace(/\\\//g, '/');
      }
      for (const v of Object.values(node)) {
        if (v && typeof v === 'object') {
          const hit = findUrlInObject(v, drill, seen);
          if (hit) return hit;
        }
      }
      return null;
    };

    const findStoredVideo = (drill) => {
      for (let i = remoteData.length - 1; i >= 0; i--) {
        const hit = findUrlInObject(remoteData[i], drill);
        if (hit) return hit;
      }
      for (const store of [localStorage, sessionStorage]) {
        for (let i = 0; i < store.length; i++) {
          const raw = store.getItem(store.key(i)) || '';
          try {
            const hit = findUrlInObject(JSON.parse(raw), drill);
            if (hit) return hit;
          } catch {}
        }
      }
      return null;
    };

    const findVideoBox = () => {
      const boxes = [...document.querySelectorAll('div,section')].filter(el => {
        if (el.querySelector('video,iframe')) return false;
        const r = el.getBoundingClientRect();
        if (r.width < 280 || r.height < 140 || r.height > 720) return false;
        const txt = (el.textContent || '').trim();
        return /^(▶|►|▷)?$/.test(txt) || txt === '';
      });
      return boxes.sort((a,b) => {
        const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
        const as = Math.abs(ar.width/ar.height - 16/9) + (ar.top < 90 ? 10 : 0);
        const bs = Math.abs(br.width/br.height - 16/9) + (br.top < 90 ? 10 : 0);
        return as - bs;
      })[0] || null;
    };

    const mountVideo = (box, url, title) => {
      if (!box || !url || box.dataset.bpdsVideoMounted === url) return;
      const embed = ytEmbed(url);
      const media = embed ? document.createElement('iframe') : document.createElement('video');
      media.style.cssText = 'width:100%;height:100%;display:block;border:0;background:#000;';
      if (embed) {
        media.src = embed;
        media.title = `${title || 'BPDS drill'} demonstration video`;
        media.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        media.allowFullscreen = true;
      } else {
        media.src = url; media.controls = true; media.playsInline = true; media.preload = 'metadata';
      }
      box.replaceChildren(media);
      box.dataset.bpdsVideoMounted = url;
    };

    function patch() {
      document.querySelectorAll('button,a').forEach(el => {
        if ((el.textContent || '').trim().toLowerCase() === 'view demo') el.remove();
      });
      document.querySelectorAll('header *').forEach(el => {
        if (el.children.length === 0 && (el.textContent || '').trim() === '🏀') {
          el.textContent = '';
          const img = document.createElement('img');
          img.src = ICON; img.alt = 'BPDS'; img.width = 38; img.height = 38;
          img.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;border-radius:10px';
          el.appendChild(img);
        }
      });
      const path = location.pathname.toLowerCase();
      if (path.includes('practice') || /block \d+ of \d+/i.test(document.body?.innerText || '')) {
        const drill = currentDrill();
        const url = findStoredVideo(drill);
        if (url) mountVideo(findVideoBox(), url, drill.name);
      }
    }

    new MutationObserver(() => {
      clearTimeout(window.__bpdsPatchTimer);
      window.__bpdsPatchTimer = setTimeout(patch, 80);
    }).observe(document.documentElement, { childList:true, subtree:true });
    window.addEventListener('DOMContentLoaded', patch);
    window.addEventListener('storage', patch);
    setInterval(patch, 1000);
  })();
  </script>
  <script type="module" crossorigin src="https://bpds-app.vercel.app/assets/index-DxXcCKDq.js"></script>
</body>
</html>
